name: senpai-probe
on:
  issue_comment:
    types: [created, edited]
concurrency:
  group: senpai-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  probe:
    if: contains(github.event.comment.body, '/senpai') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - env:
          OLD_BODY: ${{ toJSON(github.event.changes.body.from) }}
          NEW_BODY: ${{ toJSON(github.event.comment.body) }}
        run: |
          echo "action=${{ github.event.action }}"
          echo "sender=${{ github.event.sender.login }}"
          echo "assoc=${{ github.event.comment.author_association }}"
          echo "OLD_BODY=$OLD_BODY"
          echo "NEW_BODY=$NEW_BODY"
          date -u +"job_step_ran=%Y-%m-%dT%H:%M:%SZ"
